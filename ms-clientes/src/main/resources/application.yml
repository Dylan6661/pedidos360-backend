server:
  port: ${PORT:8082}

spring:
  application:
    name: ms-clientes
  datasource:
    # Ejemplo RDS: jdbc:mysql://pedidos360-db.xxxx.us-east-1.rds.amazonaws.com:3306/pedidos360_clientes
    url: ${DB_URL:jdbc:mysql://localhost:3306/pedidos360_clientes?createDatabaseIfNotExist=true&serverTimezone=UTC}
    username: ${DB_USER:admin}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

# Validación del JWT emitido por Microsoft Entra External ID
pedidos360:
  security:
    issuer-uri: ${IDAAS_ISSUER:}
    jwk-set-uri: ${IDAAS_JWKS_URI:}
    audiences: ${IDAAS_AUDIENCE:}
    # Solo para desarrollo local; en AWS el CORS lo maneja el API Gateway
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
